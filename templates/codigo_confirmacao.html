<!DOCTYPE html>
<html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Confirmação de Conta</title>
      <link rel="stylesheet" href="../static/css/cod-confirmacao.css">
      <link rel="icon" href="../static/img/favicon.ico" type="image/x-icon">
    </head>

<!-- Aqui o usuário irá inserir o código de verificação da conta na hora de criá-la -->

    <body>
        <div class="container">
            <img src="../static/img/logo-inv68-branco.png" alt="Logo do Inventário 68" class="logo-inv68"> 
            <div class="login-quadrado"> <br>
                <h2>Insira o código de confirmação</h2>
                <p class="texto-cod-conf">O código de confirmação foi enviado para</p>
                <p class="email-verif" id="email-verificacao"></p><br>

                <form method="POST" action="{% url 'confirmar_codigo' %}">
                    <!--{% csrf_token %}-->
                    <div class="cod-conf-num">
                        <input type="text" class="escrever-cod-conf" maxlength="6" pattern="\d{6}" required>
                    </div>
                </form>

                <button class="confirmar-cod-btn" type="submit">Confirmar código</button>

                <form method="POST" action="{% url 'reenviar_codigo' %}">
                    <!--{% csrf_token %}-->
                    <p class="reenviar-cod">Reenviar código</p>
                </form>

            </div>

        </div>
        <script src="../static/js/cod-conf.js"></script>
    </body>
</html>
